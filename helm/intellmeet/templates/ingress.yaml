{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "intellmeet.fullname" . }}-ingress
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Backend API routes
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" . }}-backend-service
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /meetings
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" . }}-backend-service
                port:
                  number: {{ .Values.backend.service.port }}
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" . }}-backend-service
                port:
                  number: {{ .Values.backend.service.port }}
          # Socket.io WebSocket path
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" . }}-backend-service
                port:
                  number: {{ .Values.backend.service.port }}
          # Frontend static app fallback
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "intellmeet.fullname" . }}-frontend-service
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
