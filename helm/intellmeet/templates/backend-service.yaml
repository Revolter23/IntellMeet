apiVersion: v1
kind: Service
metadata:
  name: {{ include "intellmeet.fullname" . }}-backend-service
  labels:
    {{- include "intellmeet.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  selector:
    app: {{ include "intellmeet.fullname" . }}-backend
