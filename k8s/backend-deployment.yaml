apiVersion: apps/v1
kind: Deployment
metadata:
  name: intellmeet-backend
  labels:
    app.kubernetes.io/name: intellmeet-backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intellmeet-backend
  template:
    metadata:
      labels:
        app: intellmeet-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: intellmeet-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: intellmeet-configmap
            - secretRef:
                name: intellmeet-secret
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /auth/status
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /auth/status
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: intellmeet-backend-service
  labels:
    app.kubernetes.io/name: intellmeet-backend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: intellmeet-backend
