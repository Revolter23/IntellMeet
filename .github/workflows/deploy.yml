name: IntellMeet CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ==========================================
  # Code Testing & Build Validation
  # ==========================================
  test-and-validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & Build Frontend Client (Vercel Validation)
        run: |
          cd client
          npm ci
          npm run build

      - name: Install & Validate Backend Server (Render Validation)
        run: |
          cd server
          npm ci
          node --check index.js


